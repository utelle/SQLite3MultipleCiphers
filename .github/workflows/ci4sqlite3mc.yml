name: CI for SQLite3 Multiple Ciphers
on:
  push:
    branches:
    - main
    - aegis
    - register-dynamic-cipher
    - hwaccel
  pull_request:
    branches:
    - main

jobs:
  host_unix:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, ubuntu-24.04-arm]
        cc_compiler: [gcc, clang]

    runs-on: ${{ matrix.os }}
    env:
      CC: ${{ matrix.cc_compiler }}
    steps:
    - name: Install dependencies (macOS)
      run: brew install automake
      if: matrix.os == 'macos-latest'
    - name: Checkout
      uses: actions/checkout@v7
    - name: Configure
      run: |
        autoreconf
        ./configure
    - name: Build
      run: |
        make
    - name: Testing
      run: |
        cat /proc/cpuinfo | grep flags | head -1
        gcc --version
        clang --version
        ./sqlite3shell test1.db3 ".read test/test1.sql"
        ./sqlite3shell test2.db3 ".read test/test2.sql"
        ./sqlite3shell test/persons-aegis-testkey.db3 ".read test/test3.sql"
        ./sqlite3shell test/persons-ascon128-testkey.db3 ".read test/test4.sql"
        ./sqlite3shell dummy.db3 ".read test/sqlciphertest.sql"

  android_build:
    name: Android (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api-level: [21, 28, 30, 34]
    steps:
    - name: Checkout
      uses: actions/checkout@v7
    - name: Set up Android NDK
      id: setup-ndk
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r28
    - name: Configure
      run: >
        cmake -B build
        -DCMAKE_TOOLCHAIN_FILE=${{ steps.setup-ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake
        -DANDROID_ABI=arm64-v8a
        -DANDROID_PLATFORM=${{ matrix.api-level }}
    - name: Build
      run: cmake --build build

